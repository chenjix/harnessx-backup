tracer:
  _target_: harnessx.tracing.journal.HarnessJournal
  export_jsonl: true
  silent: false
  session_id: null
  base_dir: /fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep13-i1/_meta_v2/R2/meta_workspace/sessions

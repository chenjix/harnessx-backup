# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length OR oversized no-tool
# content, plus a mechanical forced-Bash-snapshot escalation). Replaces the R0
# text-only recovery processor (same singleton group). R0 evidence: 5-task
# budget_exceeded cluster driven by a reasoning-only truncation spiral the
# text-only variant failed to break. See processors/length_recovery_forceact.py.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep15-i1/_meta_v2/R1/c0/processors/length_recovery_forceact.py::LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  force_action_threshold: 3
  head_chars: 400
  tail_chars: 0
  content_char_threshold: 40000
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.
#
# R5 (meta): R0-R4 are all flat at pass_rate 0.20 (10/50). The R4
# DegenerateTurnTerminatorProcessor was supposed to convert the dominant
# degenerate assistant-turn loop into a clean exit, but measurement on the R4
# trajectories shows it NEVER FIRED on the tasks it targeted: its byte-identical
# fingerprint requires the repeated turns to match exactly, and the real loops
# DRIFT (each regenerated "I've been stuck in a loop..." turn differs by a few
# words / a different 4096-token truncation point). The max byte-identical
# consecutive run tops out at 4 and never reaches R4's terminate_threshold=6, so
# the [LoopTerminator] banner appears 0 times in the two exit_reason=error crash
# tasks (task_000032, task_001201) and in the budget_exceeded loopers.
#
# Measured on the R4 run, the max consecutive run of assistant turns whose
# normalized token-set (Jaccard) similarity >= 0.85:
#   FAILING loopers : 4, 5, 6, 10, 17  (000032, 001044, 001465, 001201, 001028)
#   PASSING set      : max = 2 (nine of ten passers = 1)
# A similarity-based counter separates loopers from the passing set even more
# sharply than exact match did. R5 REPLACES the R4 exact-match terminator with
# FuzzyLoopTerminatorProcessor (warn at 3, terminate at 5 near-identical turns;
# similarity_threshold=0.85) — it subsumes exact matching (identical turns score
# 1.0) AND catches the drifting loops R4 missed. terminate_threshold=5 sits far
# above the passing-set ceiling of 2, so regression surface on the passing set is
# nil. Expected effect: converts the two exit_reason=error crashes into clean
# exit_reason=done (protects the replay gate, banks partial work), and reclaims
# 20-50 wasted step-generations / 600-1600s wall-clock per looping task while
# letting exit-intent processors fire. Rest of the R4 pipeline + sibling
# system_prompt.txt copied byte-for-byte.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
# R1 (meta): break degenerate identical-Bash repetition loops. Distinct from
# LengthTruncationRecoveryProcessor (which only handles finish_reason=length /
# no tool call). Kept from R1 (accepted): it still trims the Bash-input half of
# the loop early (before assistant text even repeats). The soft BLOCKED redirect
# is often ignored, which is why the terminators below provide the HARD stop.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep12-i4/_meta_v2/R1/processors/bash_loop_breaker.py::BashLoopBreakerProcessor
  warn_threshold: 3
  break_threshold: 6
  _hook_: '*'
# R5 (meta): fuzzy near-identical assistant-turn terminator. REPLACES the R4
# DegenerateTurnTerminatorProcessor, which required byte-identical turns and so
# never fired on the drifting real loops (max byte-identical run = 4 < its
# threshold 6). This version counts consecutive assistant turns whose normalized
# token-set Jaccard similarity >= 0.85 (byte-identical turns score 1.0, so it
# subsumes the exact matcher). Warns at 3 near-identical turns (one contract-safe
# user nudge); at 5 it force-terminates via skip_model + synthetic_output so the
# run loop exits cleanly (exit_reason=done) instead of crashing to error or
# burning the whole step budget. terminate_threshold=5 sits far above the
# passing-set ceiling of 2 (measured on the R4 run), so the passing set is
# untouched; it fires only after the loop is provably dead.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep12-i4/_meta_v2/R5/processors/fuzzy_loop_terminator.py::FuzzyLoopTerminatorProcessor
  similarity_threshold: 0.85
  warn_threshold: 3
  terminate_threshold: 5
  min_tokens: 5
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
# R3 (meta): proactive verifier-dep guard. Ensures common verifier test-deps
# (HTTP client / config parser) are importable in the container Python BEFORE
# the agent's session ends, regardless of exit reason. Kept unchanged from R3/R4
# (R3 result confirms it removes the pytest-collection ModuleNotFoundError on the
# HTTP-service tasks; they now fail with real ConnectionError, a server-capability
# gap, not a harness gap). Fires at most once per run; a no-op when the module is
# already present.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep12-i4/_meta_v2/R3/processors/verifier_dep_guard_proactive.py::ProactiveVerifierDepGuardProcessor
  proactive_step: 4
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

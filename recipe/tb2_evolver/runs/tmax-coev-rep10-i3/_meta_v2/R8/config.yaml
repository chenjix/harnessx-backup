# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Step-based deadline nudge. The recipe runner enforces a hard step budget
# (task.max_steps=80) but never sets TaskTimeReminderProcessor.timeout_seconds,
# so the wall-clock reminder above is inert. Multiple failures ended at
# exit_reason=budget_exceeded (80 steps) with NO deliverable file on disk —
# an automatic 0. This processor fires escalating "commit your best-effort
# output to disk now" reminders as the step budget is consumed.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep10-i3/R0/assets/processors/step_budget_deadline.py::StepBudgetDeadlineProcessor
  warn_at:
  - 0.65
  - 0.85
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
# Ensure the external verifier's standard Python HTTP client (`requests`) is
# importable in the container. TB2's verifier runs AFTER the agent exits and
# frequently does `import requests` to probe HTTP/network services the task
# asked the agent to build. When `requests` is absent the verifier's test
# module fails to collect (pytest rc=2, ModuleNotFoundError) → automatic 0
# even for a correct service. Agents build the server in C/Go/stdlib and
# probe with curl, so they never install the Python client themselves.
# This processor injects ONE quiet, idempotent `pip install requests` on the
# first model turn (append-only to the model's own call; `|| true` so it can
# never fail the turn). Fires once per task; no-op when already installed.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep10-i3/_meta_v2/R3/processors/verifier_dep_primer.py::VerifierDepPrimerProcessor
  packages: requests
  _hook_: '*'
# Ensure the standard networking CLI tools the external verifier shells out to
# are installed in the container. Same structural gap as the `requests` pip
# primer above, one layer down: several TB2 verifier tests do
# `subprocess.run(["curl", ...])` / `subprocess.run(["ss", ...])` in the
# post-agent phase and die with `FileNotFoundError: 'curl'` / `'ss'` before
# they can assert on otherwise-correct work → automatic 0. The agent hits
# `curl: command not found` during its own phase and simply works around it
# (wget / python stdlib), so it never installs the CLI client itself.
# This processor injects ONE quiet, idempotent, time-boxed apt install on the
# first model turn: a `command -v` guard makes it a no-op when the tools are
# already present, `timeout 90` bounds a blocked package index, and `|| true`
# means it can never fail the turn. Touches only system dirs, never a task
# output path. Fires once per task.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep10-i3/_meta_v2/R4/processors/verifier_cli_primer.py::VerifierCliPrimerProcessor
  apt_packages: curl iproute2
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
# Second-stage exit gate. The base CustomSelfVerifyProcessor above injects a
# one-shot verification checklist when the agent tries to exit; a weak model
# frequently rubber-stamps it with a trivial `ls`/`cat` and exits anyway,
# without re-exercising the task's real acceptance behaviour. This guard fires
# at most ONE additional, sharper prompt — only after the base checklist has
# fired AND only when the agent ran no substantive verification command
# (interpreter/test/build/service-probe/content-search) since. It never
# terminates the run and stays silent when verification was already
# substantive, so properly-verifying tasks (incl. passing ones) are untouched.
# Diagnosed on task_000118 (verified only final quiescent state of a dynamic
# monitor, missed the peak-size grader check) and task_000667 (claimed a
# config fix but only ls-ed an unrelated output, never re-checked the file).
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep20-i1/_meta_v2/R2/c4/processors/substantive_verify_guard.py::SubstantiveVerifyGuard
  _hook_: '*'
# Break identical-repeated-tool-call loops. The round's dominant failure
# mode is the agent emitting the SAME Bash call verbatim until the step
# budget is exhausted (e.g. task_000010: same `python3 -c "import socket"`
# call 33x, distinct=1). LengthTruncationRecoveryProcessor above only
# handles finish_reason=length loops; these calls are well-formed and
# succeed, so a different guard is required. Strategy 1 injects a
# "you are stuck, try something different" warning at 3 consecutive
# identical calls and raises LoopDetectedError (clean exit) at 5;
# Strategy 2 is name-only warn-only at 8. Compaction-aware.
- _target_: harnessx.processors.control.loop_detection.LoopDetectionProcessor
  window_size: 12
  warn_threshold: 3
  threshold: 5
  name_warn_threshold: 8
  compaction_drop_threshold: 5
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

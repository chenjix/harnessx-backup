# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
# R3 change (C-001): instruction lever. R1 (functional-verify) and R2
# (warn-only loop breaker) both landed flat at 23/50. Two systemic
# harness-addressable shapes remain: (a) 7 budget_exceeded tasks that are
# complex multi-step/multi-service builds where the agent thrashes and never
# commits the deliverable; (b) the SAME agents repeatedly say "I'm stuck in a
# loop, let me try a different approach" (16-17x in tasks 028/300) but keep
# making cosmetic variants of the failing command. The R2 exact-match loop
# warn (Strategy 1) barely fires now because the loops became SEMANTIC
# (varying args), and the agent already HAS the "I'm looping" awareness the
# warn provides — what it lacks is the recovery STRATEGY. This sidecar prompt
# rewrite adds two general strategies: (1) decompose-first for multi-step
# tasks (get a minimal end-to-end version + every deliverable on disk before
# perfecting one stage), and (2) a loop-escape protocol (after 2 failures,
# name the root cause and switch to a STRUCTURALLY different mechanism, not a
# tweaked flag). No task literals; general strategy only. The strong R1
# survey/restate/functional-verify content is carried forward unchanged.
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Step-based deadline nudge. The recipe runner enforces a hard step budget
# (task.max_steps=80) but never sets TaskTimeReminderProcessor.timeout_seconds,
# so the wall-clock reminder above is inert. Multiple failures ended at
# exit_reason=budget_exceeded (80 steps) with NO deliverable file on disk —
# an automatic 0. This processor fires escalating "commit your best-effort
# output to disk now" reminders as the step budget is consumed.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep10-i2/R0/assets/processors/step_budget_deadline.py::StepBudgetDeadlineProcessor
  warn_at:
  - 0.65
  - 0.85
  _hook_: '*'
# R2 change (C-001): warn-only loop breaker. R1 evidence: 11/27 failures
# exited budget_exceeded at the 80-step cap (+1 error), and the dominant shape
# is a BYTE-IDENTICAL Bash command repeated consecutively with no change of
# approach (max consecutive-identical run: 015=21, 1653=25, 191=12, 118=11).
# The agent re-issues the same failing command instead of diagnosing it,
# burning the whole budget. This reuses harnessx's existing LoopDetectionProcessor
# but configured WARN-ONLY: it appends an advisory to the tool result after 3
# byte-identical consecutive calls, telling the agent to change approach, and
# NEVER raises (threshold=999). The hard-raise is disabled because 3 currently-
# passing tasks (878/890/505) also repeat identical commands deliberately and a
# raise would convert those passes into loop_detected failures. Name-only
# Strategy 2 is disabled (name_warn_threshold=999) because every call is Bash,
# so name-only would fire on essentially every task.
- _target_: harnessx.processors.control.loop_detection.LoopDetectionProcessor
  window_size: 12
  warn_threshold: 3
  threshold: 999
  name_warn_threshold: 999
  compaction_drop_threshold: 5
  _hook_: '*'
# R4 change (C-001): windowed no-progress loop breaker (Control, warn-only).
# R3 landed at 26/50. The dominant remaining harness-addressable shape is the
# budget_exceeded cluster (7/24 R3 failures). Reading the command streams: the
# waste is now an INTERLEAVED (non-consecutive) repeat that the R2
# LoopDetectionProcessor structurally cannot catch — it counts only the
# strictly-CONSECUTIVE run at the tail of its window, so a single stray
# inspection or empty command between repeats resets the count. Measured with a
# window of 8 calls: task_000958 ran the SAME service restart+curl cycle 16x
# (max 8-of-8 in one window, first tripwire at step ~9); task_000118 ran the
# SAME monitor start+test cycle 19x (max 8-of-8, tripwire at step ~6);
# task_002073 oscillated verify/EMPTY 15x (15 empty commands). None of these
# reach the R2 consecutive warn_threshold=3. This processor adds two orthogonal
# WARN-ONLY signals: (1) windowed exact-repeat (same command >=5 times within
# the last 8 calls) → advisory to stop re-running and go read/fix the source;
# (2) empty/no-op run (>=3 blank commands in a row) → advisory to run a real
# command or finish. It NEVER raises: R3 evidence shows a currently-PASSING
# task (865) legitimately repeats a command 8x in an 8-window, and a raise
# would flip it to loop_detected. Advisory is appended to the tool result
# (event.messages is never mutated). It ignores the FunctionalVerifyGate
# keepalive tool so the exit handshake is not counted. Distinct singleton slot
# and _order=21 (just after LoopDetection at 20); the two are complementary
# (consecutive vs windowed), not duplicates. No task literals.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep10-i2/_meta_v2/R4/processors/windowed_repeat_breaker.py::WindowedRepeatBreakerProcessor
  window_size: 8
  repeat_threshold: 5
  empty_threshold: 3
  cooldown: 4
  compaction_drop_threshold: 5
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
# R1 change (C-002): replace the single-shot self-verify with a stateful,
# functional-aware exit gate. R0 evidence: 23/29 failures exited done after a
# shallow static self-check (ls/cat/grep) and never ran the solution against
# the real scenario. This gate re-nudges (bounded) when an exit attempt is
# preceded only by read-only inspection, forcing at least one genuine
# end-to-end run before finishing.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep10-i2/_meta_v2/R1/processors/functional_verify_gate.py::FunctionalVerifyGateProcessor
  max_nudges: 2
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

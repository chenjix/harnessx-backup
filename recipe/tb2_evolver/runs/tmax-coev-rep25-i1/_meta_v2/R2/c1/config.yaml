# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.
#
# R2 SYNTHESIS (c4 ⊕ c1): the pivot scores (c4=0.46, c1=0.38 vs R0=0.50)
# were depressed by docker container-name-conflict infra errors counted as
# failures. On real (status=ok) agent outcomes, c4 is net +4 and c1 net +2.
# This config keeps c4's strongest mechanism (IterativeVerifyGate) and adds
# c1's genuinely-complementary EXACT-repeat loop guard, while neutralising
# the noisy name-only warn that caused c1's only real regressions.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
# C-001 — SYNTHESIS from the c1 lineage. Degenerate EXACT-repeat loop guard.
# c1 uniquely (and genuinely, status=ok) solved task_000338 by warning the
# agent out of a byte-identical Bash loop just before it committed the
# correct answer; R0's dup-command-heavy FAIL cluster (190 dup-commands on
# FAIL vs 96 on PASS, per the R1 journal) shares this shape. Strategy 1
# (exact fingerprint) warns at 4 consecutive identical calls and hard-raises
# LoopDetectedError at 12 — 12 sits above the max observed transient-recover
# run (11, e.g. task_001591) AND above every c4 gain's max exact-identical
# run (740=1,1264=1,1498=1,1673=7,1706=9), so it cannot cut those short.
# CRITICAL DIFFERENCE FROM c1: Strategy 2 (name-only warn) is DISABLED via a
# very high name_warn_threshold. This benchmark is Bash-only, so name-only
# fingerprints match on EVERY consecutive Bash call regardless of arguments;
# in c1 that warn fired on legitimate long-horizon work and made the agent
# prematurely quit — the sole cause of c1's two real losses (task_001536,
# task_001652). Disabling it repairs that regression while preserving the
# high-precision exact-repeat mechanism that produced c1's unique solve.
- _target_: harnessx.processors.control.loop_detection.LoopDetectionProcessor
  window_size: 16
  warn_threshold: 4
  threshold: 12
  name_warn_threshold: 100000
  compaction_drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
# C-002 — SYNTHESIS from the c4 lineage. Replaces the stock one-shot
# CustomSelfVerifyProcessor with a bounded, work-aware completion gate.
# Re-nudges a no-tool-call exit up to max_nudges times, but ONLY when the
# agent tried to exit without having run a real verification command since
# the last nudge (bare "task complete" assertions or stuck-loop text exits).
# If the agent actually ran verification commands after being nudged, the
# gate steps aside. c4 flipped 5 R0 failures with this (740,1264,1498,1673,
# 1706). Its one real regression (965: gate re-nudged an already-correct
# solution into over-editing) is bounded by max_nudges=2 and further guarded
# by the exact-repeat loop detector above.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep25-i1/_meta_v2/R2/c1/processors/iterative_verify_gate.py::IterativeVerifyGate
  max_nudges: 2
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

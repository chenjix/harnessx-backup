# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Step-budget-proximity verification nudge. Complements CustomSelfVerifyProcessor
# (which fires only on a voluntary exit-intent turn) and TaskTimeReminderProcessor
# (a no-op without timeout_seconds): fires ONCE when the run crosses a fraction of
# the hard step cap, forcing the agent to confirm every required output artifact
# exists at its exact path before the budget_exceeded cap terminates the run.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep19-i2/R0/assets/processors/step_budget_verify.py::StepBudgetVerifyProcessor
  step_budget: 80
  warn_fraction: 0.8
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
# Break degenerate identical-command loops (same Bash command re-issued
# turn after turn with the same result). Complements CustomEditToolProcessor
# (which counts file edits): this keys on a normalised hash of the whole
# command, so it fires for OCR/extraction loops, compile loops, SQL/file
# rewrites — any stuck-repeat class — and escalates a directive that also
# warns against silently fabricating unreadable required data.
#
# R1 (C-001): the R0 breaker only APPENDED an advisory to the tool result.
# Trajectory task_000010_644ab1c2 shows the model reading the advisory
# ("run 6/7/8 times ... STOP") and re-issuing the byte-identical command
# anyway — each identical `python3 .../k8s_operator.py` also timing out at
# 120s, burning the whole budget to budget_exceeded. This version keeps the
# warn/hard advisory tiers verbatim and adds a third BLOCK tier: past
# block_threshold identical runs, the command is refused (approved=False +
# synthetic_result) so the dead loop can no longer consume budget. Threshold
# set high (8) so legitimate short poll/healthcheck repeats are never blocked.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep19-i2/_meta_v2/R1/c0/processors/repeated_command_breaker.py::RepeatedCommandBreaker
  tool_name: Bash
  warn_threshold: 3
  hard_threshold: 5
  block_threshold: 8
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

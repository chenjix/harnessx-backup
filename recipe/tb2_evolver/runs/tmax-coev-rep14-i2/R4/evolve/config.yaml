# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
# Break ACTION-level repetition loops (identical Bash calls repeated with no
# state progress). This is a COMPACTION-SAFE drop-in replacement for the stock
# LoopDetectionProcessor (same _singleton_group="loop_detection", _order=20).
#
# Why the replacement: the stock processor fully clears its fingerprint window
# on every compaction-driven message drop (>= compaction_drop_threshold). When
# the agent is stuck emitting the SAME Bash call repeatedly, each repeated turn
# re-narrates and re-grows the context, which itself trips CompactionProcessor
# — so the reset wipes the in-progress identical run before the consecutive
# counter can reach `threshold`, silently defeating the detector. Verified on
# this benchmark: tasks issued 9-33 byte-identical consecutive calls yet NO task
# ever produced a clean `loop_detected` exit; they burned the whole step budget
# (budget_exceeded/error) instead, and the warn-nudge never reached the agent.
#
# The fix preserves ONLY the trailing consecutive run across a compaction reset
# (dropping older heterogeneous fingerprints, which was the real stale-false-
# positive risk the reset targeted), so a genuine loop still accumulates toward
# threshold and the warn escalation still reaches the model.
#
# Knobs are recalibrated for this Bash-only agent:
#   - warn_threshold=8: injects "you are stuck, try something different" starting
#     at 8 consecutive identical calls — now reaches loop tasks that compaction
#     previously silenced, while tolerating short legit repeats.
#   - threshold=30 raises LoopDetectedError -> graceful `loop_detected` exit; set
#     ABOVE the observed recover-after-loop ceiling (task_000936 PASSED after 26
#     identical calls then recovered) so a recovering loop is never cut short,
#     while the pathological 30+ non-recovering loops get their budget reclaimed.
#   - window_size=40 > threshold so the consecutive-run tail can reach 30.
#   - name_warn_threshold=999 disables Strategy 2 (a Bash-only agent issues many
#     legit consecutive Bash calls with varying args).
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep14-i2/_meta_v2/R4/c6/processors/loop_detection_compaction_safe.py::CompactionSafeLoopDetectionProcessor
  window_size: 40
  warn_threshold: 8
  threshold: 30
  name_warn_threshold: 999
  compaction_drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

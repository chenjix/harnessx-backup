# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
# R4: system-prompt sidecar (system_prompt.txt beside this YAML) revised from
# the 5-line default to an explicit general workflow — survey, plan, diagnose
# before retry, budget awareness, verify deliverables the way an external
# checker would (real HTTP client not raw socket; exact output path/format),
# keep required services alive, avoid polluting the verifier's working dir.
# Strategy-only; no task-specific literals. SiblingSystemPromptBuilder loads it.
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
# R2 (meta): break the *normal-finish* narration repetition loop that
# LengthTruncationRecoveryProcessor cannot see. Trajectory evidence: several
# budget_exceeded tasks emit 4-15 near-identical assistant turns in a row
# ("I keep getting the same error, let me try a different approach") while never
# actually changing tactic, burning the entire step budget and exiting with the
# required output file never written. The length-recovery guard only fires on
# finish_reason=length; the edit-loop guard only watches file-write commands;
# neither catches a diagnostic/compile narration loop with a normal finish.
# This processor fingerprints assistant content and, after N consecutive
# look-alike turns, injects an escalating corrective nudge (change tactic /
# write the required output to its exact path). Mutates messages by at most +1
# user turn per chain; no task-specific literals.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep12-i2/_meta_v2/R2/processors/content_repetition_recovery.py::ContentRepetitionRecoveryProcessor
  repeat_threshold: 3
  escalate_threshold: 5
  prefix_chars: 120
  min_content_chars: 40
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
# R1 (meta): ensure common verifier test-deps (HTTP client / image-video frame
# reader / numeric+data libs / config parser) are importable in the container
# Python. TB2 verifiers frequently `import requests` / `import imageio` / etc.
# to probe a running server or inspect output; when the base image lacks the
# module the verifier aborts at pytest collection time (ModuleNotFoundError)
# and a correct solution scores 0. Revised from the prior exit-only guard:
# it now fires ONCE EARLY (first model response) instead of only on clean
# exit, closing the gap where tasks ending via budget_exceeded/error never
# triggered the install. No-op when modules already present; single Bash
# round-trip; no task-specific literals.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep12-i2/_meta_v2/R2/processors/verifier_dep_guard.py::VerifierDepGuardProcessor
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

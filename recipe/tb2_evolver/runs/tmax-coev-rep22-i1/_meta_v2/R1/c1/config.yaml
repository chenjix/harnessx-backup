# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
# Compaction: the default summariser prompt ("summarize in 2-4 sentences")
# was destroying task-critical artifacts (OCR-extracted schemas, built SQL
# queries, exact file paths/commands) on every compacted task. 7 of 8 tasks
# that compacted in R0 failed (reward=0). The summarize_prompt_template below
# forbids meta-reasoning preamble and orders the summariser to preserve
# concrete artifacts verbatim so post-compaction the agent keeps the working
# state it already earned. See _meta_scratch/candidates.md C-001.
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  summarize_prompt_template: |
    You are compacting the earlier part of a terminal coding agent's
    working transcript so it can continue the SAME task after older
    messages are dropped. Write a faithful, information-dense handoff
    note for your future self.

    Hard rules:
    - Do NOT include any meta-commentary about the summarization task
      itself (no "Thinking Process", no "Analyze the Request", no
      restating these instructions, no sentence-count targets).
    - Preserve CONCRETE ARTIFACTS VERBATIM. If the transcript contains
      any of the following, reproduce the exact text, not a paraphrase:
        * data extracted from files or images (e.g. OCR output, parsed
          schemas, route/field mappings, config values),
        * exact file paths the agent created or must create,
        * code, queries, or commands the agent settled on,
        * required output formats, thresholds, or constants stated in
          the task,
        * the latest test / verifier failure messages and what caused
          them.
    - Preserve unresolved decisions and open bugs the agent was still
      working through, and any approach it already tried and rejected
      (with the reason), so the future self does not repeat dead ends.
    - Be terse for narrative chatter, but never drop a concrete artifact
      to save space. When in doubt, keep the exact value.

    Transcript to compact:
    {conversation}

    Now write the handoff note.
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.
#
# R1 (_meta_v2) change (Control lever — corrective, cluster: HTTP-service
#   verifier dependency):
#   New VerifierDepEnsurer processor. The single largest failing cluster in the
#   R0 trajectories (7 of 32 failures, 6 domains) is "HTTP server + endpoint"
#   tasks where the external verifier's test_final_state.py does `import
#   requests` in its first lines. The base image often lacks `requests`, so
#   pytest aborts at COLLECTION time (ModuleNotFoundError -> "Interrupted: 1
#   error during collection") and every test errors at once — including the
#   ones the agent's solution would have passed. The agent cannot anticipate
#   this: it self-tests its server with urllib/curl (no `requests` needed) and
#   the verifier's test file does not exist during the agent phase. This is a
#   harness/environment deficiency, not a model capability gap. The processor
#   arms only on HTTP-service task descriptions and, on the first Bash call,
#   prepends an idempotent silent best-effort `pip install requests` guard that
#   can never abort the agent's own command. pip works in this environment
#   (numpy/scipy/flask were fetched by other tasks), so the fix is viable.
#   The DeadLoopBreaker processor and system_prompt.txt sidecar are retained
#   unchanged; both are vendored under this round's output_dir so the config
#   is self-contained.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
# Ensure the standard HTTP-client verifier dependency (`requests`) is importable
# on HTTP-service tasks so the external verifier's test module can be collected.
# Purely mechanical, scoped to the HTTP-service task class, fires once per task,
# and never alters the agent's own command semantics. See processor docstring.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep13-i2/_meta_v2/R1/processors/verifier_dep_ensurer.py::VerifierDepEnsurer
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
# Break GENUINE dead command loops (see processors/dead_loop_breaker.py).
# Successor to R1's RepeatCommandGuard. That guard keyed on the command string
# alone and was advisory-only; on this model the agent ignored the advisory and
# re-ran the exact same command with the exact same output until it burned the
# step budget (one task looped 12x on a read-only diagnostic -> agent_error).
# DeadLoopBreaker keys on (command, output-fingerprint) so healthy
# iterate-and-test loops (output changes each run) are never touched, and it
# escalates from an advisory to a HARD BLOCK: at block_threshold identical
# (command, output) repeats the next identical call is intercepted (approved=
# False + synthetic directive) and does not execute, forcing the agent off the
# dead command. block_threshold=5 sits above the max identical (command,output)
# repeat count reached by any observed PASSING task (<=2), so passers that
# re-run a build/write many times are unaffected. Retained unchanged from R3.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep13-i2/_meta_v2/R1/assets/processors/dead_loop_breaker.py::DeadLoopBreaker
  advisory_threshold: 3
  block_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

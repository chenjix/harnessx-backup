# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.
#
# R4 (meta): the dominant cross-round failure shape (R0-R3 all flat at 0.20) is
# a DEGENERATE ASSISTANT-TURN LOOP — the model emits the byte-identical
# assistant turn 4-41 times in a row, sometimes with a useless repeated Bash
# call, sometimes with NO tool call at all (a self-verify ack loop). 16 distinct
# FAILING tasks in R3 showed a run >= 4; no PASSING task ever exceeded 2. Four of
# the 16 ended in exit_reason=error (agent_error crash). The R1 BashLoopBreaker
# only fingerprints the Bash tool INPUT, so it is blind to the no-tool-call half
# of the loop, and its soft "BLOCKED" redirect is ignored verbatim (transcripts
# show 12-38 blocks the model re-emits identically). The R2 system prompt already
# tells the model to stop looping; it ignores that too. Instruction + soft
# redirect are proven-saturated. R4 adds DegenerateTurnTerminatorProcessor: it
# fingerprints the whole last assistant turn, warns at warn_threshold=4, and at
# terminate_threshold=6 sets skip_model + synthetic_output so the run loop takes
# its own clean-exit path (finish_reason=stop, no tool calls -> exit_reason=done).
# This converts the error/budget_exceeded runaways into a clean done that banks
# partial work and lets exit-intent processors (verifier-dep guard) fire, and
# reclaims 20-70 wasted step-generations per looping task. Thresholds leave the
# entire passing set (max identical-assistant run = 2) untouched. Rest of the
# pipeline + sibling system_prompt.txt copied byte-for-byte from R3.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
# R1 (meta): break degenerate identical-Bash repetition loops. Distinct from
# LengthTruncationRecoveryProcessor (which only handles finish_reason=length /
# no tool call). Kept from R1 (accepted). NOTE for R3: post-hoc analysis shows
# the model frequently IGNORES the BLOCKED redirect and re-emits the identical
# command many times; the R2 system prompt reinforces "don't burn budget on a
# doomed subgoal" to help the model act on this signal rather than ignore it.
# R4: BashLoopBreaker is retained (it still trims the Bash-input half of the
# loop early), but the new DegenerateTurnTerminatorProcessor below now provides
# the HARD escalation the model needs when it ignores the soft block.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep12-i4/_meta_v2/R1/processors/bash_loop_breaker.py::BashLoopBreakerProcessor
  warn_threshold: 3
  break_threshold: 6
  _hook_: '*'
# R4 (meta): degenerate assistant-turn terminator. Fingerprints the whole last
# assistant turn (not just a Bash input), so it catches Bash loops AND
# no-tool-call / self-verify loops that BashLoopBreaker cannot see. Warns at 4
# consecutive identical turns; at 6 it force-terminates via skip_model +
# synthetic_output so the run loop exits cleanly (exit_reason=done) instead of
# crashing to error or burning the whole step budget. Passing set (max identical
# run = 2) is untouched; fires only after the loop is provably dead.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep12-i4/_meta_v2/R4/processors/degenerate_turn_terminator.py::DegenerateTurnTerminatorProcessor
  warn_threshold: 4
  terminate_threshold: 6
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
# R3 (meta): proactive verifier-dep guard. Ensures common verifier test-deps
# (HTTP client / config parser) are importable in the container Python BEFORE
# the agent's session ends, regardless of exit reason. The prior exit-intent-
# only guard never fired on budget_exceeded HTTP-service tasks (steps=80), so
# their verifier aborted at pytest collection time with
# `ModuleNotFoundError: No module named 'requests'` and a correct solution
# scored 0. This version prepends the dep-ensure onto the first mid-run
# tool-call turn at/after proactive_step, and keeps the exit-intent fallback.
# Fires at most once per run; a no-op when the module is already present.
# R4 note: R3 result confirms this works — the three target tasks (796/910/2108)
# no longer hit collection ImportError; they now fail with real ConnectionError
# (server capability gap, not a harness gap). Kept unchanged.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep12-i4/_meta_v2/R3/processors/verifier_dep_guard_proactive.py::ProactiveVerifierDepGuardProcessor
  proactive_step: 4
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

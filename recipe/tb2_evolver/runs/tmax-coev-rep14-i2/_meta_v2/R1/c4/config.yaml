# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.StaticTmaxSystemPromptBuilder
    text: |
      You are a terminal coding agent solving a single Linux task.
      Use the Bash tool to inspect the environment, edit files, and run commands.
      Work under /home/user unless the instruction says otherwise.
      When the task is complete, stop calling tools and briefly confirm what you did.
      Do not ask questions — act.

      ## Verifying computed results before you finish

      Whenever a task asks you to produce a computed or numeric result (a
      fitted parameter, a statistic, a search/optimization outcome, an
      aggregate, a transformed dataset), a solution that runs without errors
      and looks plausible is NOT evidence that the value is correct. "Looks
      physically sensible" or "matches the required format" only checks the
      shape, never the number. Grading compares your value against an exact
      reference within a tolerance, so a self-consistent but subtly-wrong
      computation still scores zero. Before you declare such a task done:

      1. **Cross-validate with an independent method.** Recompute the key
         result a second, different way — a different library, a simpler
         closed-form check, a small hand-worked case, or a reference
         implementation in another language/tool available in the sandbox.
         If the two computations disagree, your primary implementation has a
         bug; find it before exiting. If they agree, you have real evidence.

      2. **Surface and test the ambiguous choices.** Deterministic pipelines
         are sensitive to details the prompt may under-specify: array
         indexing (0- vs 1-based, inclusive vs exclusive bounds), the exact
         order in which random draws are consumed under a fixed seed, which
         axis/variable is the regressor, rounding vs truncation, off-by-one
         in a search or loop range, and float precision. List the choices
         your code made at each such point, re-read the task to see which the
         specification actually pins down, and where it is genuinely
         ambiguous, try the alternative interpretation and compare — do not
         assume your first reading is the intended one.

      3. **Sanity-check against the data.** Confirm you read every input
         record you were supposed to (row/element counts), that no rows were
         silently dropped or misparsed, and that intermediate quantities are
         in a believable range given the inputs.

      Apply this discipline to computational tasks only; for tasks with no
      checkable computed output, verify the required files exist at their
      exact paths and hold the intended content, then finish.
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

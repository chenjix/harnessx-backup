# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
# Break degenerate period-k tool-call loops (identical call+output repeated)
# by BLOCKING the repeated call and injecting a redirect — WITHOUT terminating
# the run — so the agent reclaims its remaining step budget for the real task.
# Escalates to a hard loop-detected stop only if the agent ignores repeated
# redirects. Fires purely on the structural "identical call+output repeated"
# property; carries no task-specific constants. See processor docstring for
# the evolve-set evidence (task_000118 28x period-1, task_001857 period-2 A-B).
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep22-i4/R0/assets/processors/cyclic_loop_breaker.py::CyclicLoopBreaker
  max_period: 4
  warn_cycles: 2
  break_cycles: 3
  max_total_blocks: 12
  window_size: 32
  compaction_drop_threshold: 5
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
# Stronger self-verification checklist for computation tasks. Subclasses the
# stock CustomSelfVerifyProcessor (identical fires-once / exit-turn / keepalive
# mechanics) but swaps the injected checklist for one that forces independent
# re-derivation of at least one output value and a contradiction sweep between
# the agent's own reasoning and its emitted output. General debugging strategy,
# no task-specific constants. Evidence: task_000109 emitted a window mean of 128
# while narrating "window 4 has all zeros" and exited via no_tool_calls; same
# confident-exit-on-wrong-numbers shape recurs across data_science /
# scientific_computing / security failures.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep22-i4/_meta_v2/R1/c3/processors/self_verify_crosscheck.py::SelfVerifyCrossCheckProcessor
  _hook_: '*'
# HTTP-service tasks are graded by an external verifier that queries the
# service with the `requests` client (its test does `import requests`).
# Several containers ship without `requests`, so the verifier's test fails at
# *collection* time even when the service is correct and running — the agent
# cannot see this because verifier files are injected after it exits.
# This hook detects a server start and injects one reminder to make `requests`
# importable before finishing. Fires once, only on tasks that start a server.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep22-i4/R0/assets/processors/http_verifier_dep.py::HttpVerifierDepProcessor
  _hook_: '*'
# Some tasks require a Python file whose basename shadows a stdlib module (e.g.
# a script that MUST live at /home/user/operator.py). Such a file, sitting in a
# directory on sys.path, poisons EVERY python3 start-up in that directory with a
# circular import (collections -> `from operator import eq`), crashing not only
# the agent's own tests but the external verifier's pytest/runpy — a correct
# solution scores 0. The agent observes the traceback but lacks the escape.
# This hook detects the structural circular-import signature in Bash output,
# confirms the offending traceback frame names a user file whose basename is a
# real stdlib module, and injects one-time recovery strategy (transparent shim /
# guard-under-__main__ / verify from grader CWD). Fires once per task, no
# task-specific constants. Evidence: task_000010_644ab1c2 final_pytest died with
# "Could not import runpy module" / "partially initialized module 'collections'
# ... circular import" pointing at /home/user/operator.py.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep22-i4/_meta_v2/R2/c0/processors/stdlib_shadow_guard.py::StdlibShadowGuard
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

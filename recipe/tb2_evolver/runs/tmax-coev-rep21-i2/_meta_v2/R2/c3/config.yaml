# HarnessX HarnessConfig for Tmax taxonomy eval / evolve.
# Combine: model_config.agentic(HarnessConfig.from_yaml(this))
#
# Live surfaces MetaAgent may edit:
#   - processors (this file)
#   - tool_registry (this file)
#   - system_prompt.txt (sibling of this YAML; read by SiblingSystemPromptBuilder)
#
# Runtime-only slots (sandbox_provider, tracer) are injected by
# recipe.tmax_eval.harness_runner — do not put them here.
#
# Per-call output cap is NOT in this YAML: harness_runner sets
# OpenAIProvider(max_tokens=TMAX_MAX_TOKENS, default 4096) so a single
# runaway generation cannot burn an hour of wall-clock on one task.

tool_registry:
  builtin:
  - Bash
  custom: []
tracer: null
processors:
- _target_: harnessx.processors.context.system_prompt.SystemPromptProcessor
  system_builder:
    _target_: recipe.tmax_eval.prompt_builder.SiblingSystemPromptBuilder
  _hook_: '*'
- _target_: harnessx.processors.context.env_context_injector.EnvironmentContextInjector
  working_dir: /home/user
  constraints: {}
  header: Environment
  max_tree_lines: 20
  non_interactive: true
  inject_integrity_rules: true
  show_project_dir: false
  _hook_: '*'
- _target_: harnessx.processors.control.tool_call_correction.ToolCallCorrectionLayer
  tool_schemas: {}
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.TaskTimeReminderProcessor
  warn_at:
  - 0.7
  - 0.9
  _hook_: '*'
# Ensure the standard HTTP client the external verifier imports (`requests`)
# is present in the container's SYSTEM python3 for service-shaped tasks.
# The verifier phase runs `/tmp/test_final_state.py` (injected AFTER the agent
# exits) against the container's final state; that module does `import requests`
# under the same system python3. The eval base image ships no `requests`, so the
# verifier crashes at COLLECTION — the agent's working solution is never scored
# (observed on 3+ HTTP/socket-service tasks whose own tool output shows the
# service returning the expected response). The agent cannot infer this because
# the test files do not exist during its session. Best-effort, idempotent,
# service-gated, contract-neutral (never mutates messages, never raises). Runs
# early (`_order=5`) at task_start when the sandbox contextvar is already set.
- _target_: file:///fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/runs/tmax-coev-rep21-i2/_meta_v2/R2/c3/processors/verifier_dep_ensure.py::VerifierDepEnsureProcessor
  timeout_seconds: 90.0
  _hook_: '*'
# Break max_tokens repetition loops (finish_reason=length, no tool call).
# Without this, one stuck task can block an entire evolve round.
- _target_: recipe.tmax_eval.processors.length_recovery.LengthTruncationRecoveryProcessor
  repeat_threshold: 2
  head_chars: 1200
  tail_chars: 600
  _hook_: '*'
# Break ACTION-level loops: the model issues the exact same Bash command
# many times in a row (18-29 verbatim repeats observed on the R0
# budget_exceeded cluster). Strategy 1 (exact name+inputs) injects an
# escalating "you are looping — try something fundamentally different"
# warning into each repeated tool result from repeat 3 onward, then
# raises LoopDetectedError at repeat 8 to reclaim budget on hopeless
# verbatim loops. Warn-before-raise gives the model several chances to
# self-correct and finish before the run is terminated. Strategy 2
# (name-only) is warn-only and, because the only tool is Bash, is
# effectively disabled by a high name_warn_threshold so it does not
# false-positive on legitimate multi-command work.
- _target_: harnessx.processors.control.loop_detection.LoopDetectionProcessor
  window_size: 12
  warn_threshold: 3
  threshold: 8
  name_warn_threshold: 999
  compaction_drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.compaction.CompactionProcessor
  token_threshold: 140000
  message_threshold: 100
  retention_window: 6
  eviction_fraction: 0.5
  summarize_key: summarize
  preserve_first_message: true
  _hook_: '*'
- _target_: harnessx.processors.control.parse_retry.ParseRetryProcessor
  max_consecutive_errors: 1
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.PostCompactionRefreshProcessor
  drop_threshold: 5
  _hook_: '*'
- _target_: harnessx.processors.control.bg_install_guard.BgInstallGuard
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomEditToolProcessor
  threshold: 7
  _hook_: '*'
- _target_: benchmarks.terminal_bench_2.harness.CustomSelfVerifyProcessor
  _hook_: '*'
workspace: null
workspace_template: default
init_workspace: false
step_snapshots: true
sandbox_provider: null
sandbox_hint_id: null
plugins: []

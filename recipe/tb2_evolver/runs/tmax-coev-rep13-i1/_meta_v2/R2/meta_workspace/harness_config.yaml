  _code_hash: sha256:a5213096e1e5ed10
  system_builder:
    _target_: harnessx.processors.context.strategies.system_prompt.default.DefaultSystemPromptBuilder
    _code_hash: sha256:ea3d4c6302cf2af1
    max_skills_shown: 20
    max_spawn_depth: 3
    extra_skills_dirs:
    - /fsx/home/jixuan.chen/harnessx-backup/recipe/tb2_evolver/skills
    - /fsx/home/jixuan.chen/harnessx-backup/harnessx/meta_harness/workspace/skills
    persona_root: /fsx/home/jixuan.chen/harnessx-backup/harnessx/meta_harness/workspace
  _hook_: '*'
- _target_: harnessx.meta_harness.processors.write_scope_gate.WriteScopeGateProcessor
  _code_hash: sha256:c981e79ac5cdaf31
  allowed_roots:
  - !!python/object/apply:pathlib.PosixPath
    - /
    - fsx
    - home
    - jixuan.chen
    - harnessx-backup
    - recipe
    - tb2_evolver
    - runs
    - tmax-coev-rep13-i1
    - _meta_v2
    - R2
  allowed_files:
  - !!python/object/apply:pathlib.PosixPath
    - /
    - fsx
    - home
    - jixuan.chen
    - harnessx-backup
    - recipe
    - tb2_evolver
    - runs
    - tmax-coev-rep13-i1
